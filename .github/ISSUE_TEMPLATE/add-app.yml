name: Add Application
description: Submit a new application to the Uran Store catalog
title: "[App] "
labels: ["app-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Fill this form and a maintainer will add your app to the catalog.

  - type: input
    id: app_id
    attributes:
      label: Application ID
      description: Unique lowercase ID with hyphens (e.g. `tqztr-editor`)
      placeholder: my-app
    validations:
      required: true

  - type: input
    id: app_name
    attributes:
      label: Application name
      placeholder: My App
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author
      placeholder: your-name
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Short description
      description: One or two sentences, max 200 chars
    validations:
      required: true

  - type: input
    id: repo_url
    attributes:
      label: Source repository URL
      placeholder: https://github.com/you/my-app
    validations:
      required: true

  - type: input
    id: download_url
    attributes:
      label: Download URL
      description: Direct link to .tar.gz (usually GitHub Releases tag archive)
      placeholder: https://github.com/you/my-app/releases/download/v1.0.0/my-app-linux.tar.gz
    validations:
      required: true

  - type: input
    id: icon_url
    attributes:
      label: Icon URL (SVG or PNG, 64x64+)
      placeholder: https://raw.githubusercontent.com/you/my-app/main/icon.svg
    validations:
      required: true

  - type: input
    id: executable
    attributes:
      label: Executable path inside archive
      placeholder: bin/my-app
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: License
      description: Must be an OSI-approved open source license
      placeholder: MIT / GPL-3.0 / Apache-2.0
    validations:
      required: true

  - type: textarea
    id: build_install
    attributes:
      label: Build & install commands (optional, only if source-only)
      description: Fill if users must build from source. Leave empty for prebuilt binaries.
      placeholder: |
        build_cmd: cmake -B build && cmake --build build -j$(nproc)
        install_cmd: cp build/my-app $BIN_DIR/
