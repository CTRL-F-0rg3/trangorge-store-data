name: Add app from issue

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true

jobs:
  add-app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch issue body
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          BODY=$(gh issue view "$ISSUE_NUM" --repo "${{ github.repository }}" --json body --jq '.body')
          {
            echo "body<<BODY_EOF"
            echo "$BODY"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "num=$ISSUE_NUM" >> "$GITHUB_OUTPUT"

      - name: Parse issue and add to index.json
        env:
          ISSUE_BODY: ${{ steps.fetch.outputs.body }}
          ISSUE_NUM: ${{ steps.fetch.outputs.num }}
        run: |
          python3 << 'PY'
          import json, os, re, sys

          body = os.environ.get('ISSUE_BODY', '')
          num = os.environ.get('ISSUE_NUM', '?')

          def field(name):
              pattern = rf'###\s+{re.escape(name)}\s*\n+(.*?)(?=\n###|\Z)'
              m = re.search(pattern, body, re.DOTALL | re.IGNORECASE)
              if not m: return ''
              val = m.group(1).strip()
              if val in ('_No response_', '_none_', 'none', '', 'N/A', 'n/a'): return ''
              return val

          app_id = field('Application ID').strip().lower().replace(' ', '-')
          if not app_id:
              print(f"Issue #{num}: no Application ID field — skipping")
              sys.exit(0)

          app = {
              "id": app_id,
              "name": field('Application name'),
              "author": field('Author'),
              "description": field('Short description'),
              "repo_url": field('Source repository URL'),
              "icon_url": field('Icon URL (SVG or PNG, 64x64+)'),
              "executable": field('Executable path inside archive'),
              "license": field('License'),
          }

          download = field('Download URL')
          if download: app["download_url"] = download

          app = {k: v for k, v in app.items() if v}
          missing = [k for k in ('id', 'name', 'repo_url', 'executable') if k not in app]
          if missing:
              print(f"Issue #{num}: missing required fields {missing} — skipping")
              sys.exit(0)

          with open('index.json') as f:
              data = json.load(f)

          data['apps'] = [a for a in data['apps'] if a.get('id') != app_id]
          data['apps'].append(app)
          data['apps'].sort(key=lambda x: x.get('name', '').lower())

          with open('index.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print(f"Issue #{num}: added app '{app_id}'")
          PY

      - name: Commit and push
        run: |
          git config user.name "uran-bot"
          git config user.email "bot@trangorge.org"
          git add index.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add app from issue #${{ steps.fetch.outputs.num }}"
          git push

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const num = parseInt('${{ steps.fetch.outputs.num }}', 10);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              body: '✅ App added to catalog. Restart Uran to see it.'
            })
